<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annur Design - Receipt Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 400px; margin: auto; background-color: #f4f4f9; }
    .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h2 { color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    .optional { font-weight: normal; font-size: 12px; color: #888; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1a252f; }
    button:disabled { background: #95a5a6; cursor: not-allowed; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; color: #27ae60; line-height: 1.4; }
    .error { color: #c0392b !important; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Annur Design Invoice</h2>
    <form id="invoiceForm">
      <div class="form-group">
        <label>Customer Name:</label>
        <input type="text" id="customerName" required>
      </div>
      <div class="form-group">
        <label>Buyer Email: <span class="optional">(Optional - sends PDF receipt)</span></label>
        <input type="email" id="customerEmail" placeholder="buyer@example.com">
      </div>
      <div class="form-group">
        <label>Item Description:</label>
        <input type="text" id="description" required>
      </div>
      <div class="form-group">
        <label>Amount (RM):</label>
        <input type="number" step="0.01" id="amount" required>
      </div>
      <button type="submit" id="submitBtn">Generate PDF Receipt</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzFKnQN91n0p4eZWB2uNXgTPIBXTtPFaw1V6YmQSpHs7r1jKqZvzhAaVo85U_Wr7Q/exec";

    document.getElementById('invoiceForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const form = document.getElementById('invoiceForm');
      
      const data = {
        customerName: document.getElementById('customerName').value,
        customerEmail: document.getElementById('customerEmail').value,
        description: document.getElementById('description').value,
        amount: document.getElementById('amount').value
      };

      btn.disabled = true;
      btn.innerText = data.customerEmail ? "Generating & Emailing..." : "Generating PDF...";
      status.className = "";
      status.innerText = "";

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success) {
          let msg = `PDF Saved! <a href="${result.url}" target="_blank">View PDF</a>`;
          if (result.emailSent) {
            msg += `<br>Receipt emailed to ${data.customerEmail}`;
          }
          status.innerHTML = msg;
          form.reset();
        } else {
          status.className = "error";
          status.innerText = "Error: " + result.error;
        }
      } catch (error) {
        status.className = "error";
        status.innerText = "Network Error. Check console for details.";
        console.error("Error:", error);
      } finally {
        btn.disabled = false;
        btn.innerText = "Generate PDF Receipt";
      }
    });
  </script>
</body>
</html>
